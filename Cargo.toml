[package]
name = "linhares-escala5x2-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Formulario web de horarios e simulador 5x2 com interpretacao basica em portugues"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
